name: Check curated Chiikawa knowledge
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node scripts/export-chiikawa-knowledge.mjs
      - run: python scripts/check-chiikawa-knowledge.py docs/chiikawa-knowledge-20261012.json --self-test
      - run: git diff --exit-code -- docs/chiikawa-knowledge-20261012.json
      - run: npm ci
      - run: npm test
